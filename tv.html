<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flixo - TV Show</title>
    <link rel="icon" href="./Images/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link id="theme-style" rel="stylesheet" href="./css/styleLight.css" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6452748402255868"
     crossorigin="anonymous"></script>
  </head>
  <body>
    <nav class="navigator">
      <div class="container">
        <div class="nav-container">
          <div class="nav-left">
            <a href="index.html">Flixo</a>
          </div>
          <div class="nav-center">
            <ul class="nav-list">
              <li><a href="./index.html">Home</a></li>
              <li><a href="./movies.html">Movies</a></li>
              <li><a href="./tvshows.html">TV Shows</a></li>
              <li><a href="#footer">Studios</a></li>
            </ul>
          </div>
          <div class="nav-right">
            <form class="searchForm" action="">
              <input type="text" class="searchInput" placeholder="Search movies & TV shows..." />
              <button class="bi bi-search searchBtn"></button>
              <div class="search-popup"></div>
            </form>
            <a href="./wishlist.html" class="bi bi-star-fill wishlistBtn"></a>
            <i class="bi bi-brightness-high-fill themeBtn"></i>
          </div>
          <div class="hamburger">
            <i class="bi bi-list hamburgerBtn"></i>
          </div>
        </div>
      </div>
    </nav>

    <div class="hamburger-menu">
      <i class="bi bi-x exitBtn"></i>
      <ul class="nav-list">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./movies.html">Movies</a></li>
        <li><a href="./tvshows.html">TV Shows</a></li>
        <li><a href="#footer">Studios</a></li>
        <li>
          <form class="searchForm">
            <input
              type="text"
              class="searchInput"
              placeholder="Search movies & TV shows..."
            />
            <button type="submit" class="bi bi-search searchBtn"></button>
            <div class="search-popup"></div>
          </form>
          <a href="./wishlist.html" class="bi bi-star-fill wishlistBtn"></a>
          <i class="bi bi-brightness-high-fill themeBtn"></i>
        </li>
      </ul>
    </div>

    <div class="container">
      <div class="film-view tv-view">
        <div class="film-left">
          <img class="movie-poster tv-poster" src="" alt="TV Show poster" />
        </div>
        <div class="film-right">
          <h1 class="movie-title tv-title"></h1>
          <p class="movie-tagline tv-tagline" style="font-style: italic; opacity: 0.8; margin-bottom: 10px;"></p>
          <p class="movie-overview tv-overview"></p>
          <p class="movie-rating tv-rating">
            <span class="round" id="round"></span>
          </p>
          <p class="movie-release tv-release"></p>
          <p class="tv-episodes-info" style="font-weight: 600; margin: 10px 0; color: #228ee5;"></p>
          <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 15px; justify-content: center;">
            <button class="watchMovie watchTvShow"><i class="bi bi-play-fill"></i> Watch Show</button>
            <button class="wishlistAddBtn tvWishlistBtn"><i class="bi bi-star"></i> Add To Wishlist</button>
          </div>
          <div class="wishlist-message"></div>
        </div>
      </div>
    </div>

    <div class="container seasons-episodes-section">
      <div class="seasons-header-bar">
        <h2 class="seasons-heading"><i class="bi bi-collection-play"></i> Seasons & Episodes</h2>
        <div class="active-episode-indicator" id="activeEpisodeIndicator" style="font-weight: 600; font-size: 1.1rem; color: #f29335;">
          Selected: Season 1, Episode 1
        </div>
      </div>

      <div class="seasons-tabs-wrapper">
        <label class="seasons-label">Select Season:</label>
        <div class="seasons-tabs" id="seasonsTabs"></div>
      </div>

      <div class="episodes-container">
        <h3 class="current-season-title" id="currentSeasonTitle">Episodes</h3>
        <div class="episodes-grid" id="episodesGrid"></div>
      </div>
    </div>

    <div id="videoPopup" class="video-popup">
      <div class="video-container">
        <iframe
          id="popupVideo"
          width="100%"
          height="100%"
          src=""
          title="TV Show Player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        >
        </iframe>
      </div>
    </div>

    <footer class="footer" id="footer">
      <h2>Studios</h2>
      <img src="./Images/Group 27.png" alt="studios" />
      <p>Flixo - All Rights Reserved.</p>
    </footer>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
